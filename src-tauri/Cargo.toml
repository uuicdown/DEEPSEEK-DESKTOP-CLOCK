[package]
name = "deepseek-clock"
version = "0.1.0"
description = "DeepSeek Clock Desktop Application by Soren"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [ "system-tray", "window-all" ] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
